# Version updates go to develop (strict gitflow: main/master only receive releases).
# Security updates ignore target-branch and still open against the default branch.
version: 2
updates:
  - package-ecosystem: npm # pnpm-lock.yaml is handled by the npm ecosystem
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
