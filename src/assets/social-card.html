<!--
  Source for public/images/seo/social-card.png (1200x630).
  To regenerate: open this file in Chrome at a 1200x630 viewport and
  screenshot it (or: npx playwright screenshot --viewport-size=1200,630
  src/assets/social-card.html public/images/seo/social-card.png).
  Icon paths are relative to this file's location in the repo.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        background: #fcfcfa;
        color: #1a1c1e;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 84px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .brand img {
        display: block;
        height: 96px;
        width: auto;
      }
      .brand__word {
        font-size: 54px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      h1 {
        font-size: 76px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.12;
        max-width: 17ch;
      }
      .sub {
        margin-top: 26px;
        font-size: 31px;
        color: #71767c;
      }
      .apps {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .apps img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        border: 1px solid rgba(26, 28, 30, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../../public/images/brand/pixeldog-mark.png" alt="" />
      <span class="brand__word">pixeldog</span>
    </div>

    <div>
      <h1>Native apps for&nbsp;humans.</h1>
      <p class="sub">
        The one-person app studio of Rubens Pessoa · Graz, Austria.<br />iPhone, iPad, Mac, and
        Apple&nbsp;Watch.
      </p>
    </div>

    <div class="apps">
      <img src="../../public/images/apps/save-my-cactus-icon.png" alt="" />
      <img src="../../public/images/apps/hustlrr-icon.jpg" alt="" />
      <img src="../../public/images/apps/giorni-icon.jpg" alt="" />
    </div>
  </body>
</html>
